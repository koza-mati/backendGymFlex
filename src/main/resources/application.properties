spring.application.name=backendGymFlex
# Port, uruchomienia backendu
server.port=8081

# Dane po??czenia do bazy PostgreSQL na localhost
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymflex_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfiguracja Hibernate
# 'update' sprawia, ?e Spring sam stworzy lub zaktualizuje tabele na podstawie naszych encji
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.separator=@@


# Ustawienia JWT (wykorzystany w Security)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
gymflex.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
gymflex.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
gymflex.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Gym}
gymflex.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}


# Wypisywanie zapyta? SQL w konsoli IntelliJ
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
