services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymflex_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gymflex-local-only
    ports:
      - "5432:5432"
    volumes:
      - gymflex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymflex_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymflex-postgres:
